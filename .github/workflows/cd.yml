name: neurousCD

on:
  push:
    branches: [ develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build (artifact only)
        run: ./gradlew clean build -x test

      - name: NCP Registry Login
        run: |
          echo ${{ secrets.NCP_SECRET_KEY }} | docker login neurous.kr.ncr.ntruss.com \
            -u ${{ secrets.NCP_ACCESS_KEY }} --password-stdin

      - name: Build & Push Image
        run: |
          docker build -t neurous.kr.ncr.ntruss.com/neurous/neurous-api:${{ github.sha }} .
          docker push neurous.kr.ncr.ntruss.com/neurous/neurous-api:${{ github.sha }}

      - name: Deploy to Server
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/neurous
            docker pull neurous.kr.ncr.ntruss.com/neurous/neurous-api:${{ github.sha }}
            IMAGE_TAG=${{ github.sha }} docker-compose --env-file .env.prod -f docker-compose.prod.yml up -d --force-recreate --remove-orphans
