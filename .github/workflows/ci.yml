name: neurousCI

on:
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build & Test
        uses: gradle/gradle-build-action@v3
        with:
          arguments: clean test
        env:
          SPRING_PROFILES_ACTIVE: test
