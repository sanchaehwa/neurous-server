name: neurous CI/CD

on:
  pull_request:
    branches: [ develop ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: ./gradlew clean build

      - name: Registry Login
        run: |
          echo ${{ secrets.NCP_SECRET_KEY }} | \
          docker login neurous.kr.ncr.ntruss.com \
            -u ${{ secrets.NCP_ACCESS_KEY }} \
            --password-stdin

      - name: Build Image
        run: docker build -t neurous.kr.ncr.ntruss.com/neurous/neurous-api:latest .

      - name: Push Image
        run: docker push neurous.kr.ncr.ntruss.com/neurous/neurous-api:latest

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull neurous.kr.ncr.ntruss.com/neurous/neurous-api:latest
            docker rm -f neurous-api || true
            docker run -d \
              --name neurous-api \
              --restart always \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=dev \
              -e DB_URL=${{ secrets.DB_URL }} \
              -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              neurous.kr.ncr.ntruss.com/neurous/neurous-api:latest
