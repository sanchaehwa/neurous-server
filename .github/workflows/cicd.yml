# PR에서는 build만 수행
# develop 브랜치로 merge(push)될 때만 Docker push + 배포

name: neurous CI/CD

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ✅ PR / push 공통: 빌드만
      - name: Build
        run: ./gradlew clean build -x test

      # 🚫 PR에서는 실행 안 됨
      # ✅ develop push일 때만 실행
      - name: Login to NCP Container Registry
        if: github.event_name == 'push'
        run: |
          echo ${{ secrets.NCP_SECRET_KEY }} | \
          docker login neurous.kr.ncr.ntruss.com \
            -u ${{ secrets.NCP_ACCESS_KEY }} \
            --password-stdin

      - name: Build Docker Image
        if: github.event_name == 'push'
        run: |
          docker build \
            -t neurous.kr.ncr.ntruss.com/neurous/neurous-api:latest .

      - name: Push Docker Image
        if: github.event_name == 'push'
        run: |
          docker push neurous.kr.ncr.ntruss.com/neurous/neurous-api:latest

      - name: Deploy to Server
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull neurous.kr.ncr.ntruss.com/neurous/neurous-api:latest
            docker rm -f neurous-api || true
            docker run -d \
              --name neurous-api \
              --restart always \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=dev \
              -e DB_URL=${{ secrets.DB_URL }} \
              -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              neurous.kr.ncr.ntruss.com/neurous/neurous-api:latest
