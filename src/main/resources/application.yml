#spring.application.name=server
spring:
  application:
    name: server
  profiles:
    default: local
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  config:
    import:
      - optional:config/flyway.yml

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
  refresh-expiration: 2592000000

app:
  backend:
    base-url: ${APP_BACKEND_URL:http://175.45.193.98:8080}

oauth:
  kakao:
    user-info-url: https://kapi.kakao.com/v2/user/me
  google:
    user-info-url: https://www.googleapis.com/oauth2/v2/userinfo
  naver:
    user-info-url: https://openapi.naver.com/v1/nid/me

ncp:
  object-storage:
    bucket-base-url: ${NCP_BUCKET}
    profile-url: ${NCP_PROFILE_BUCKET}
    character-url: ${NCP_CHARACTER_BUCKET}
